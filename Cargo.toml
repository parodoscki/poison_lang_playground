[package]
name = "poison_wasm_bindgen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "compiler_server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors"] } # Allows your website frontend to talk to this backend
lib_helper = {path = "./project_POISON/lib_helper"}